<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Happy Trails Samiti</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    padding: 22px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 6px 0 0;
    opacity: 0.8;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}

.card-title {
    font-size: 14px;
    color: #667085;
}

.card-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.section {
    margin-top: 25px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    background: #172033;
    color: white;

    border: none;
    border-radius: 8px;

    padding: 11px 18px;

    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.table-container {
    background: white;

    border-radius: 12px;

    overflow-x: auto;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;

    border-bottom:
        1px solid #eeeeee;

    text-align: left;
}

th {
    background: #fafafa;
}

.income {
    font-weight: bold;
}

.expense {
    font-weight: bold;
}

.empty {
    padding: 30px;

    text-align: center;

    color: #667085;
}

@media(max-width:800px) {

    .cards {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

@media(max-width:500px) {

    .container {
        padding: 12px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 21px;
    }

}

</style>

</head>


<body>


<header>

<div class="container">

<h1>
Happy Trails Samiti
</h1>

<p>
Accounts & Sponsorship Management
</p>

</div>

</header>


<div class="container">


<!-- DASHBOARD -->

<div class="cards">


<div class="card">

<div class="card-title">
Total Income
</div>

<div
id="income"
class="card-value">

₹0

</div>

</div>


<div class="card">

<div class="card-title">
Total Expenses
</div>

<div
id="expenses"
class="card-value">

₹0

</div>

</div>


<div class="card">

<div class="card-title">
Current Balance
</div>

<div
id="balance"
class="card-value">

₹0

</div>

</div>


<div class="card">

<div class="card-title">
Pending Sponsorship
</div>

<div
id="pending"
class="card-value">

₹0

</div>

</div>


</div>



<!-- TRANSACTIONS -->

<div class="section">

<div class="section-header">

<h2>
Recent Transactions
</h2>

<button
onclick="refreshData()">

Refresh

</button>

</div>


<div class="table-container">

<table>

<thead>

<tr>

<th>Date</th>

<th>Reference</th>

<th>Type</th>

<th>Name</th>

<th>Category</th>

<th>Amount</th>

<th>Payment</th>

</tr>

</thead>


<tbody id="transactions">

<tr>

<td
colspan="7"
class="empty">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>


</div>


<script>


function formatMoney(value) {

return "₹" +
Number(value || 0)
.toLocaleString(
"en-IN",
{
maximumFractionDigits: 2
}
);

}


async function loadDashboard() {

try {

const response =
await fetch(
"/api/dashboard"
);

const data =
await response.json();


document.getElementById(
"income"
).textContent =
formatMoney(
data.total_income
);


document.getElementById(
"expenses"
).textContent =
formatMoney(
data.total_expenses
);


document.getElementById(
"balance"
).textContent =
formatMoney(
data.balance
);


document.getElementById(
"pending"
).textContent =
formatMoney(
data.sponsorship_pending
);


}

catch(error) {

console.error(error);

}

}



async function loadTransactions() {

try {

const response =
await fetch(
"/api/transactions"
);

const transactions =
await response.json();


const tbody =
document.getElementById(
"transactions"
);


if (
transactions.length === 0
) {

tbody.innerHTML = `
<tr>
<td colspan="7"
class="empty">

No transactions found.

</td>
</tr>
`;

return;

}


tbody.innerHTML =
transactions
.slice(0, 50)
.map(
transaction => `

<tr>

<td>
${transaction.transaction_date}
</td>

<td>
${transaction.transaction_ref}
</td>

<td>
${transaction.transaction_type}
</td>

<td>
${transaction.name_or_vendor}
</td>

<td>
${transaction.category}
</td>

<td>
${formatMoney(
transaction.amount
)}
</td>

<td>
${transaction.payment_mode || ""}
</td>

</tr>

`
)
.join("");


}

catch(error) {

console.error(error);

}

}



async function refreshData() {

await loadDashboard();

await loadTransactions();

}


refreshData();


</script>


</body>

</html>
